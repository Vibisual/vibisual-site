# 지표(스타·설치 수·최신 릴리스 태그·다운로드 파일명)를 10분마다 받아 stats.json 으로 커밋한다.
#
# 방문자는 GitHub API 를 부르지 않는다 — 같은 도메인의 stats.json 한 장만 읽는다.
# 무인증 GitHub API 는 **보는 사람 IP 당 시간 60회**라, 새로고침을 몇십 번 하거나
# 이동통신망(여러 사람이 한 IP)에서 들어오면 금세 비고 숫자가 '—' 로 죽는다.
# 여기서 쓰는 GITHUB_TOKEN 은 저장소당 시간 1,000회이고 이 잡은 한 번에 2회만 쓴다.

name: stats

on:
  # 10분마다. 새 버전을 내면 버전 배지와 다운로드 파일명이 늦어도 그 안에 바뀐다.
  #
  # 분을 3,13,23... 으로 어긋나게 잡은 이유: GitHub 은 예약 실행을 보장하지 않고,
  # 정각·10분 같은 '둥근' 분에 전 세계 예약이 몰려 밀리거나 통째로 버려진다(공식 문서가
  # "시간 시작 무렵을 피해 다른 분에 잡으라"고 권고한다). '*/10' 으로 뒀더니 한 시간 반 동안
  # 한 번도 잡히지 않아 어긋난 분으로 옮겼다. 되돌리지 마라.
  #
  # 예약이 밀려도 지표가 '—' 로 죽지는 않는다 — 방문자는 GitHub 이 아니라 stats.json 을 읽고,
  # 그 파일은 마지막으로 성공한 값을 그대로 들고 있기 때문이다. 밀려서 손해 보는 것은
  # '새 릴리스를 낸 뒤 사이트가 새 버전을 보여주기까지의 지연' 하나뿐이고, 그마저도
  # 아래 push·workflow_dispatch 로 즉시 앞당길 수 있다.
  # (0초로 만들려면 앱 저장소의 릴리스 워크플로가 여기로 repository_dispatch 를 쏘면 되는데,
  #  저장소를 넘는 호출이라 PAT 을 시크릿에 넣어야 한다 — 지금은 토큰 없이 되는 쪽으로 둔다.)
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:        # 손으로 즉시 돌리고 싶을 때
  push:                     # 사이트에 뭘 올리면 그 시점 값으로 한 번 맞춘다
    branches: [main]
    # 이 잡이 GITHUB_TOKEN 으로 되커밋한 푸시는 워크플로를 다시 깨우지 않는다(GitHub 이 막는다) —
    # 그래서 여기서 push 를 받아도 무한 반복이 되지 않는다.

permissions:
  contents: write           # stats.json 을 되커밋하기 위해 필요하다

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: stats.json + 페이지 폴백 짓기
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-stats.mjs stats.json index.html

      # 위 단계가 index.html 안의 버전·파일명을 고쳤으면, 그것을 복사해 만든 화면별 페이지도
      # 같이 다시 지어야 한다. 안 그러면 /blog/ · /docs/ 이하가 지난 버전을 계속 내보낸다.
      # (index.html 이 그대로면 이 스크립트도 아무 파일도 건드리지 않는다 — 내용이 같으면 쓰지 않는다.)
      - name: 화면별 페이지 · sitemap 다시 짓기
        run: node build-seo.mjs

      # 값이 그대로인 시간에는 커밋하지 않는다 — 안 그러면 한 시간마다 빈 커밋이 쌓이고
      # 그때마다 Pages 가 다시 배포된다.
      # index.html 도 같이 본다 — 스크립트가 그 안의 폴백(버전 · 다운로드 파일 이름)도 맞추기 때문이다.
      - name: 바뀐 때만 커밋
        run: |
          PATHS="stats.json index.html blog docs robots.txt sitemap.xml"
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "값 그대로 - 커밋하지 않는다"
            exit 0
          fi
          MSG=$(node -e 'const s=require("./stats.json");process.stdout.write("chore(stats): 스타 "+s.stars+" · 설치 "+s.installs+" · "+s.release.tag)')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $PATHS
          git commit -m "$MSG"
          git push
